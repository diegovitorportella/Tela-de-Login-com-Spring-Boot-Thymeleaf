<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUC Library | Login</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="login-container">

    <div class="login-image-logo-container">
        <img th:src="@{/images/apc-login-bg.png}" alt="PUC Library">

        <div class="hero-content">
            <h1>PUC Library</h1>

            <p>
                Plataforma moderna para gerenciamento
                acadêmico e bibliotecário.
            </p>
        </div>
    </div>

    <div class="login-form">

        <form th:action="@{/login}" method="post">

            <h2 class="login-title">
                Bem-vindo
            </h2>

            <p class="login-subtitle">
                Entre com suas credenciais para continuar
            </p>

            <div class="input-group">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/>
                    <path d="m22 6-10 7L2 6"/>
                </svg>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Usuário ou E-mail"
                        required>
            </div>

            <div class="input-group">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Senha"
                        required>

                <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword(this)">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                </button>

            </div>

            <div class="login-button-container">
                <button type="submit">
                    Entrar
                </button>
            </div>

            <div class="separator">
                <span>PUC Minas</span>
            </div>

            <p class="login-redirect-options">
                Não possui uma conta?
                <a href="/register">Cadastre-se</a>
            </p>

            <p class="login-redirect-options">
                <a href="/recoverpassword">
                    Esqueceu sua senha?
                </a>
            </p>

        </form>

    </div>

</div>

<script>
    function togglePassword(btn) {
        const input = btn.previousElementSibling;

        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>

</body>
</html>
