<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro de Login</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="login-container">

    <div class="login-image-logo-container">

        <img th:src="@{/images/apc-login-bg.png}" alt="PUC Library">

        <div class="hero-content">
            <h1>PUC Library</h1>
            <p>
                Sistema acadêmico e gerenciamento bibliotecário.
            </p>
        </div>

    </div>

    <div class="login-form">

        <form th:action="@{/login}" method="post">

            <h2 class="login-title">
                Login
            </h2>

            <p class="login-subtitle">
                Entre com suas credenciais
            </p>

            <div class="input-group">

                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/>
                    <path d="m22 6-10 7L2 6"/>
                </svg>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Usuário"
                        required>

            </div>

            <div class="input-group">

                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Senha"
                        required>

            </div>

            <div class="login-button-container">
                <button type="submit">
                    Entrar
                </button>
            </div>

            <p class="login-error">
                Falha ao efetuar login. Verifique usuário e senha.
            </p>

            <p class="login-redirect-options">
                <a th:href="@{/register}">
                    Cadastre-se
                </a>
                |
                <a th:href="@{/recoverpassword}">
                    Esqueceu sua senha?
                </a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
